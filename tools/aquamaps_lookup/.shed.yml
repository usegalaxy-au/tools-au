name: aquamaps_lookup
owner: galaxy-australia
description: AquaMaps lookup, probability that each species occurs at each sample location (OceanOmics amplicon pipeline)
long_description: |
  Runs the AQUAMAPS step of the OceanOmics amplicon pipeline (Minderoo Foundation OceanOmics Centre,
  release 1.3.4). For each species and each sample location, it reads the AquaMaps probability of
  occurrence for the half-degree ocean cell from an SQLite copy of the AquaMaps data.
homepage_url: https://github.com/Minderoo-OceanOmics-Centre-UWA/OceanOmics-amplicon-nf
remote_repository_url: https://github.com/usegalaxy-au/tools-au/tree/master/tools/aquamaps_lookup
type: unrestricted
categories:
  - Metagenomics
  - Ecology
